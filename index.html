<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elm Minesweeper</title>
    <style>
        @keyframes cellReveal {
            0% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
            }
            50% {
                transform: rotateY(90deg) scale(0.95);
                opacity: 0.8;
            }
            100% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
            }
        }

        @keyframes cellPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes gameWin {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes gameLoss {
            0%, 100% {
                transform: translateX(0);
            }
            10%, 30%, 50%, 70%, 90% {
                transform: translateX(-5px);
            }
            20%, 40%, 60%, 80% {
                transform: translateX(5px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes confetti {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        @keyframes sparkle {
            0%, 100% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                transform: scale(1) rotate(180deg);
                opacity: 1;
            }
        }

        .cell-reveal {
            animation: cellReveal 0.3s ease-out;
        }

        .cell-pulse {
            animation: cellPulse 0.2s ease-out;
        }

        .game-win {
            animation: gameWin 0.6s ease-out;
        }

        .game-loss {
            animation: gameLoss 0.5s ease-out;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            animation: confetti 3s linear forwards;
            z-index: 1000;
        }

        .sparkle {
            position: fixed;
            width: 20px;
            height: 20px;
            pointer-events: none;
            animation: sparkle 1s ease-out forwards;
            z-index: 1000;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
    </style>
    <script src="main.compiled.js"></script>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script>
        var app = Elm.Main.init({ flags: null });

        // Confetti effect on victory
        function createConfetti() {
            const colors = ['#6366F1', '#22C55E', '#EAB308', '#EF4444', '#06B6D4', '#A855F7'];
            const confettiCount = 100;

            for (let i = 0; i < confettiCount; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = (Math.random() * 0.5) + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0%';
                    document.body.appendChild(confetti);

                    setTimeout(() => {
                        confetti.remove();
                    }, 5000);
                }, i * 15);
            }
        }

        // Sparkle effect
        function createSparkles() {
            const colors = ['#FFD700', '#FFA500', '#FFFF00'];
            const sparkleCount = 30;

            for (let i = 0; i < sparkleCount; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.style.left = (Math.random() * 80 + 10) + '%';
                    sparkle.style.top = (Math.random() * 60 + 20) + '%';
                    sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    sparkle.style.animationDelay = (Math.random() * 0.3) + 's';
                    document.body.appendChild(sparkle);

                    setTimeout(() => {
                        sparkle.remove();
                    }, 1500);
                }, i * 50);
            }
        }

        // Listen for game state changes
        if (app.ports && app.ports.celebrateVictory) {
            app.ports.celebrateVictory.subscribe(function() {
                createConfetti();
                createSparkles();
            });
        }
    </script>
</body>
</html>
